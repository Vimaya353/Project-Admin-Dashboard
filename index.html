<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <aside class="sidebar">
            <div class="logo">
                <h1>Dashboard</h1>
            </div>

            <nav class="navigation">
                <ul>
                    
                     <li><span class="icon">🏠</span>Home</li>
                     <li><span class="icon">◯</span>Profile</li>
                     <li><span class="icon">✉</span>Messages</li>
                     <li><span class="icon">◷</span>History</li>
                     <li><span class="icon">✓</span>Tasks</li>
                     <li><span class="icon">♟</span>Communities</li>
                    
                </ul>
            </nav>

            <nav class="secondary-navigation">
                <ul>
                    <li><span class="icon">⚙</span>Settings</li>
                    <li><span class="icon">?</span>Support</li>
                    <li><span class="icon">🔒</span>Privacy</li>
                </ul>
            </nav>
        </aside>

        <header class="header">
          
            <div class="top-row">
                
                <div class="search">
                    <span class="search-icon">🔍</span>
                    <input type="text" placeholder="Search...">
                </div>

                <div class="user-info">
                    <span class="notification">🔔</span>
                    <span class="username">Vimaya</span>
                </div>

            </div>

            
                <div class="bottom-row">

                    <div class="greeting">
                        <span class="avatar">👤</span>

                        <div>
                            <p>Hi there,</p>
                            <p>Vimaya!</p>
                        </div>
                    </div>

                    <div class="actions">
                        <button>New</button>
                        <button>Upload</button>
                        <button>Share</button>
                    </div>
                </div>

        </header>

        <main class="main-content">
            
            <section class="projects">
                <h2>Your Projects</h2>

                <div class="project-grid">
                    
                </div>
            </section>

            <section class="announcements">
                <h2>Announcements</h2>
            </section>

            <section class="trending">
                <h2>Trending</h2>
            </section>

        </main>
    </div>

</body>
</html>
